# Blueprint do Render: API (Docker) + Postgres. Valores marcados com sync:false
# são pedidos no painel na criação (nunca ficam no repositório).
databases:
  - name: evve-db
    plan: basic-256mb
    databaseName: evve
    user: evve

services:
  - type: web
    name: evve-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: AMBIENTE_APP
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: evve-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # https://SEU-DOMINIO (Vercel)
      - key: BACKEND_URL
        sync: false   # https://evve-api.onrender.com (ou domínio próprio)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false   # <conta>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: UPLOADS_BASE_URL
        sync: false   # URL pública do bucket
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false   # Evve <no-reply@SEU-DOMINIO>
      - key: GOOGLE_CLIENT_ID
        sync: false
